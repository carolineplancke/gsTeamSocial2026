<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0B0F1A;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #6CFF00;
    }

    .card {
      background: #121826;
      border-radius: 20px;
      padding: 20px;
      margin: 20px auto;
      max-width: 420px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border-radius: 14px;
      font-size: 16px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #6CFF00;
      color: black;
    }

    .secondary {
      background: #1E2A44;
      color: white;
    }

    .ghost {
      background: none;
      border: 1px solid #444;
      color: white;
    }

    #status {
      margin-bottom: 10px;
      font-weight: bold;
    }

    /* FULL SCREEN SCANNER */
    #scanOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0B0F1A;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    #scanHeader {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 18px;
      font-size: 18px;
    }

    #scanHeader button {
      background: none;
      border: none;
      color: white;
      font-size: 22px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
    }

    #scanFrame {
      position: absolute;
      width: 260px;
      height: 260px;
      border: 4px solid #6CFF00;
      border-radius: 20px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(108,255,0,0.6);
    }

    #scanHint {
      position: absolute;
      bottom: 70px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<h1>🧱 Build Together 2026</h1>

<div class="card">
  <div id="status">Not signed in</div>

  <button class="btn primary" onclick="startScanner('signin')">
    Scan your badge to sign in
  </button>

  <button class="btn secondary" onclick="startScanner('scan')">
    Scan a teammate
  </button>

  <button class="btn ghost" onclick="resetUser()">
    Reset
  </button>
</div>

<!-- FULL SCREEN SCANNER -->
<div id="scanOverlay">
  <div id="scanHeader">
    <span>Scan QR Code</span>
    <button onclick="closeScanner()">✕</button>
  </div>

  <div id="reader"></div>

  <div id="scanFrame"></div>

  <div id="scanHint">Align QR code inside the frame</div>
</div>

<script>
const LS_USER = "qrgame_user";
const LS_SCANS = "qrgame_scans";

let scanner = null;
let isScanning = false;

const statusEl = document.getElementById("status");

// STATUS
function updateStatus() {
  const user = localStorage.getItem(LS_USER);

  if (user) {
    statusEl.innerText = "✅ You are: " + user;
  } else {
    statusEl.innerText = "Not signed in";
  }
}

updateStatus();

// RESET
function resetUser() {
  localStorage.clear();
  location.reload();
}

// START FULLSCREEN SCANNER
async function startScanner(mode) {
  if (isScanning) return;
  isScanning = true;

  document.getElementById("scanOverlay").style.display = "flex";

  scanner = new Html5Qrcode("reader");

  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      (decodedText) => {
        handleScan(decodedText, mode);
        closeScanner();
      }
    );
  } catch (err) {
    console.error(err);
    statusEl.innerText = "⚠️ Camera failed";
    isScanning = false;
  }
}

// CLOSE SCANNER
function closeScanner() {
  if (scanner) {
    scanner.stop().then(() => {
      scanner.clear();
    });
  }

  document.getElementById("scanOverlay").style.display = "none";
  isScanning = false;
}

// SCAN LOGIC
function handleScan(text, mode) {
  let id = text;

  try {
    if (text.startsWith("http")) {
      const url = new URL(text);
      id = url.searchParams.get("id") || text;
    }
  } catch {}

  if (!id) return;

  // SIGN IN
  if (mode === "signin") {
    localStorage.setItem(LS_USER, id);
    updateStatus();
    statusEl.innerText = "✅ Signed in as " + id;
    return;
  }

  const currentUser = localStorage.getItem(LS_USER);

  if (!currentUser) {
    statusEl.innerText = "⚠️ Sign in first";
    return;
  }

  if (currentUser === id) {
    statusEl.innerText = "😄 That’s you";
    return;
  }

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  const exists = scans.find(s => s.from === currentUser && s.to === id);

  if (exists) {
    statusEl.innerText = "⚠️ Already scanned";
    return;
  }

  scans.push({
    from: currentUser,
    to: id
  });

  localStorage.setItem(LS_SCANS, JSON.stringify(scans));

  statusEl.innerText = "✅ +1 connection with " + id;
}
</script>

</body>
</html>
