<!DOCTYPE html>
<html>
<head>
  <title>QR Connection Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body style="font-family: Arial; text-align:center; padding:20px;">

<h2>QR Connection Game 🎉</h2>

<p id="status">Not signed in</p>

<button id="signinBtn" style="padding:14px; margin:10px;">Scan your badge to sign in</button>
<button id="scanBtn" style="padding:14px; margin:10px;">Scan someone</button>
<br><br>
<button onclick="resetUser()">Reset user</button>

<div id="scanner" style="width:320px; margin:20px auto;"></div>

<script>
const LS_USER = "qrgame_user";
const LS_SCANS = "qrgame_scans";

const statusEl = document.getElementById("status");
const scannerDiv = document.getElementById("scanner");

let scanner = null;
let isScanning = false;

// Update status
function updateStatus() {
  const user = localStorage.getItem(LS_USER);
  if (user) {
    statusEl.innerText = "You are: " + user;
  } else {
    statusEl.innerText = "Not signed in";
  }
}

updateStatus();

// Reset
function resetUser() {
  localStorage.removeItem(LS_USER);
  localStorage.removeItem(LS_SCANS);
  location.reload();
}

// Start scanner
function startScanner(mode) {
  if (isScanning) return;

  isScanning = true;
  scannerDiv.innerHTML = "";

  // create scanner
  scanner = new Html5QrcodeScanner("scanner", { fps: 10, qrbox: 250 });

  scanner.render((decodedText) => {
    handleScan(decodedText, mode);

    // stop AFTER success
    scanner.clear().then(() => {
      isScanning = false;
    });
  });
}

// Handle scan
function handleScan(text, mode) {
  let id = text;

  try {
    if (text.startsWith("http")) {
      const url = new URL(text);
      id = url.searchParams.get("id") || text;
    }
  } catch {}

  if (!id) return;

  // SIGN IN
  if (mode === "signin") {
    localStorage.setItem(LS_USER, id);
    updateStatus();
    statusEl.innerText = "✅ Signed in as " + id;
    return;
  }

  // SCAN MODE
  const currentUser = localStorage.getItem(LS_USER);

  if (!currentUser) {
    statusEl.innerText = "⚠️ Sign in first";
    return;
  }

  if (currentUser === id) {
    statusEl.innerText = "😄 That’s you!";
    return;
  }

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  const exists = scans.find(s => s.from === currentUser && s.to === id);

  if (exists) {
    statusEl.innerText = "⚠️ Already scanned";
    return;
  }

  scans.push({
    from: currentUser,
    to: id,
    time: new Date().toISOString()
  });

  localStorage.setItem(LS_SCANS, JSON.stringify(scans));

  statusEl.innerText = "✅ +1 connection with " + id;
}

// Buttons
document.getElementById("signinBtn").onclick = () => {
  startScanner("signin");
};

document.getElementById("scanBtn").onclick = () => {
  startScanner("scan");
};
</script>

</body>
</html>
