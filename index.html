<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/gsTeamSocial2026/">

  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="app.js"></script>

<!-- ✅ FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyDrGat6lUuENewTehvJ6yk1_hY2xROEIRw",
      authDomain: "buildtogethergs2026.firebaseapp.com",
      projectId: "buildtogethergs2026",
      storageBucket: "buildtogethergs2026.firebasestorage.app",
      messagingSenderId: "360094439415",
      appId: "1:360094439415:web:fef720adb4793b1d2b00f2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    window.auth = auth;
    
    // auto login
    signInAnonymously(auth).catch(console.error);
    
    // expose uid when ready
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUid = user.uid;
        console.log("✅ UID:", user.uid);
        document.getElementById("status").innerText = "Ready ✅";
      }
    });


    // expose globally
    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
    window.doc = doc;
    window.setDoc = setDoc;
  </script>
  
<link rel="stylesheet" href="styles.css">
  
</head>

<body>

  <h1>Build Together</h1>

  <div id="toast"></div>

  <div id="scanScreen" class="screen active">
    <div class="card">
      <div id="status">Not signed in</div>

      <!-- ✅ PRIMARY FEATURE -->
      <button class="btn hero" onclick="startScanner('scan')">Scan teammate</button>

      <!-- ✅ SECONDARY -->
      <button class="btn secondary subtle" onclick="startScanner('signin')">Scan your badge</button>

      <button class="btn ghost" onclick="resetUser()">Reset</button>
    </div>
  </div>

  <div id="historyScreen" class="screen">
    <div class="card">
      <h3>Connections</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <div id="scanOverlay">
    <div id="readerWrapper">
      <div id="reader"></div>
      <div id="scanFrame"></div>
    </div>
  </div>

  <div id="leaderboardScreen" class="screen">
    <div class="card">
      <h3>Leaderboard</h3>

      <h4>Top Connectors</h4>
      <div id="topConnectors"></div>

      <h4 style="margin-top:20px;">Most Popular</h4>
      <div id="mostPopular"></div>
    </div>
  </div>

  <div id="nav">
    <button onclick="showScreen('scan')" class="nav-primary">Scan</button>
    <button onclick="showScreen('history')">History</button>
    <button onclick="showScreen('leaderboard')">🏆</button>
  </div>

</body>
</html>
