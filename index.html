<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/gsTeamSocial2026/">

  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <!-- ✅ FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyDrGat6lUuENewTehvJ6yk1_hY2xROEIRw",
      authDomain: "buildtogethergs2026.firebaseapp.com",
      projectId: "buildtogethergs2026",
      storageBucket: "buildtogethergs2026.firebasestorage.app",
      messagingSenderId: "360094439415",
      appId: "1:360094439415:web:fef720adb4793b1d2b00f2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    window.auth = auth;
    
    // auto login
    signInAnonymously(auth).catch(console.error);
    
    // expose uid when ready
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUid = user.uid;
        console.log("✅ UID:", user.uid);
        document.getElementById("status").innerText = "Ready ✅";
      }
    });


    // expose globally
    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
    window.doc = doc;
    window.setDoc = setDoc;
  </script>

  <style>
    body {
      font-family: Arial;
      background: #0B0F1A;
      color: white;
      margin: 0;
      padding: 20px 20px 150px; /* more space for taller nav */
    }

    h1 { color: #6CFF00; }

    .screen { display:none; }
    .active { display:block; }

    .card {
      background:#121826;
      padding:24px;
      border-radius:24px;
      margin:24px auto;
      max-width:420px;
    }

    .btn {
      width:100%;
      padding:18px;
      margin:12px 0;
      border-radius:16px;
      border:none;
      font-weight:bold;
      font-size:16px;
      cursor:pointer;
    }

    /* ⭐ HERO BUTTON (main feature) */
    .hero {
      background:#6CFF00;
      color:black;
      font-size:20px;
      padding:22px;
      border-radius:20px;
      box-shadow:0 0 18px rgba(108,255,0,0.6);
    }

    .secondary { background:#1E2A44; color:white; }
    .subtle { opacity:0.82; }

    .ghost {
      background:none;
      border:1px solid #444;
      color:white;
    }

    .historyItem {
      display:flex;
      gap:10px;
      padding:10px;
      border-bottom:1px solid #2A334C;
    }

    .avatar {
      width:44px;
      height:44px;
      border-radius:8px;
    }

    /* ✅ MUCH MORE THUMB FRIENDLY NAV */
    #nav {
      position:fixed;
      bottom:0;
      width:100%;
      height:110px;
      background:#121826;
      display:flex;
      padding-bottom:10px;
      z-index:999;
    }

    #nav button {
      flex:1;
      border:none;
      background:none;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:16px;
      color:white;
      cursor:pointer;
    }

    .nav-primary {
      color:#6CFF00;
      font-weight:bold;
    }

    #scanOverlay {
      position:fixed;
      inset:0;
      background:#0B0F1A;
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    #readerWrapper {
      position:relative;
      width:90vw;
      max-width:420px;
      aspect-ratio: 3 / 4;
    }

    #reader {
      width:100%;
      height:100%;
    }

    #reader video {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    #scanFrame {
      position:absolute;
      top:50%;
      left:50%;
      width:70%;
      height:50%;
      border:4px solid #6CFF00;
      transform:translate(-50%,-50%);
      box-shadow:0 0 20px rgba(108,255,0,0.6);
      pointer-events:none;
    }

    #toast {
      position:fixed;
      bottom:140px; /* above taller nav */
      left:50%;
      transform:translateX(-50%);
      background:#121826;
      padding:12px 18px;
      border-radius:12px;
      border:1px solid #2A334C;
      display:none;
      font-weight:bold;
      z-index:10000;
    }
  </style>
</head>

<body>

  <h1>Build Together</h1>

  <div id="toast"></div>

  <div id="scanScreen" class="screen active">
    <div class="card">
      <div id="status">Not signed in</div>

      <!-- ✅ PRIMARY FEATURE -->
      <button class="btn hero" onclick="startScanner('scan')">Scan teammate</button>

      <!-- ✅ SECONDARY -->
      <button class="btn secondary subtle" onclick="startScanner('signin')">Scan your badge</button>

      <button class="btn ghost" onclick="resetUser()">Reset</button>
    </div>
  </div>

  <div id="historyScreen" class="screen">
    <div class="card">
      <h3>Connections</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <div id="scanOverlay">
    <div id="readerWrapper">
      <div id="reader"></div>
      <div id="scanFrame"></div>
    </div>
  </div>

  <div id="leaderboardScreen" class="screen">
    <div class="card">
      <h3>Leaderboard</h3>

      <h4>Top Connectors</h4>
      <div id="topConnectors"></div>

      <h4 style="margin-top:20px;">Most Popular</h4>
      <div id="mostPopular"></div>
    </div>
  </div>

  <div id="nav">
    <button onclick="showScreen('scan')" class="nav-primary">Scan</button>
    <button onclick="showScreen('history')">History</button>
    <button onclick="showScreen('leaderboard')">🏆</button>
  </div>

  <script>
    const LS_SCANS = "scans";

    let PEOPLE = {};
    let scanner;
    let isScanning = false;

    // ✅ LOAD PEOPLE (expects clean JSON objects: {name,email,jobTitle,id})
    async function loadPeople() {
      const res = await fetch("people.json");
      const data = await res.json();

      data.forEach(p => {
        if (!p || !p.id) return;
        PEOPLE[p.id] = { name: p.name, title: p.jobTitle };
      });
    }

    // ✅ INIT
    (async function init(){
      await loadPeople();
      document.getElementById("status").innerText = "Ready to scan ✅";
    })();

    // ✅ IMAGE LOADER (kept as you had it)
    function setImageSource(img, uid){
      const formats = ["jpg","jpeg","png","JPG"];
      let i = 0;
      function tryNext(){
        if(i >= formats.length) return;
        img.src = `images/${uid}.${formats[i++]}`;
      }
      img.onerror = tryNext;
      tryNext();
    }

    // ✅ NAV (fixed: no relying on global element variables)
    function showScreen(s){
      document.getElementById("scanScreen").classList.toggle("active", s==="scan");
      document.getElementById("historyScreen").classList.toggle("active", s==="history");
      document.getElementById("leaderboardScreen").classList.toggle("active", s==="leaderboard");

      if(s==="history") loadHistory();
      if(s==="leaderboard") loadLeaderboard();
    }

    // ✅ TOAST
    function showToast(msg){
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(()=>{ t.style.display="none"; }, 2000);
    }

    // ✅ SCANNER
    async function startScanner(mode){
      if(isScanning) return;

      isScanning = true;
      document.getElementById("scanOverlay").style.display = "flex";

      // stop previous instance if any
      if(scanner){
        try { await scanner.stop(); } catch(e) {}
        try { scanner.clear(); } catch(e) {}
      }

      scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10 },
          (text) => {
            if (!isScanning) return;
            isScanning = false;

            handleScan(text, mode);
            closeScanner();
          }
        );
      } catch (e) {
        console.error(e);
        showToast("Camera error — check permissions");
        closeScanner();
      }
    }

    async function closeScanner(){
      try {
        if(scanner){
          await scanner.stop();
          await scanner.clear();
        }
      } catch(e) {}

      document.getElementById("scanOverlay").style.display = "none";
      isScanning = false;
    }

    // ✅ SCAN LOGIC + FIREBASE
    function handleScan(text, mode){
      if (mode === "signin") {
      // save mapping: UID → person
      if(window.db && window.setDoc && window.doc){
        window.setDoc(window.doc(window.db, "users", user), {
          personId: id
        }).then(() => {
          showToast(`👋 You are now ${person?.name || id}`);
          document.getElementById("status").innerText =
            `Signed in as ${person?.name || id}`;
        }).catch(console.error);
      }
    
      return;
    }
      
      const id = (text || "").trim();
      if(!id) return;

      const person = PEOPLE[id];
      const user = window.currentUid;
      
      if(!user){
        showToast("Still connecting… try again");
        return;
      }

      const user = window.currentUid;
      if(!user){
        showToast("Still connecting… try again");
        return;
      }

      let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];
      const exists = scans.some(s => s.from === user && s.to === id);
      
      if(!exists){
        scans.push({ from:user, to:id });
        localStorage.setItem(LS_SCANS, JSON.stringify(scans));

        // ✅ FIREBASE SAVE (safe + optional)
        if(window.db && window.addDoc && window.collection){
          window.addDoc(window.collection(window.db, "scans"), {
          scannerUid: user,
          scannedPersonId: id,
            timestamp: Date.now()
          }).then(()=>{
            console.log("✅ Firebase saved");
          }).catch(err=>{
            console.warn("Firebase error", err);
          });
        }
      }

      showToast(person ? `✅ +1 ${person.name}` : `✅ Saved`);
    }

    // ✅ HISTORY
    function loadHistory(){
      const list = document.getElementById("historyList");
      list.innerHTML = "";

      const user = localStorage.getItem(LS_USER);
      const scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

      scans.filter(s => s.from === user).forEach(s => {
        const row = document.createElement("div");
        row.className = "historyItem";

        const img = document.createElement("img");
        img.className = "avatar";
        setImageSource(img, s.to);

        const p = PEOPLE[s.to] || {};

        const text = document.createElement("div");
        text.innerHTML = `
          <strong>${p.name || s.to}</strong><br>
          <small>${p.title || ""}</small>
        `;

        row.appendChild(img);
        row.appendChild(text);
        list.appendChild(row);
      });
    }

    // ✅ RESET
    function resetUser(){
      localStorage.clear();
      location.reload();
    }

    // ✅ LEADERBOARD
    async function loadLeaderboard(){
      if(!window.db){
        console.warn("No Firebase connection");
        document.getElementById("topConnectors").innerHTML = "Firebase not available";
        document.getElementById("mostPopular").innerHTML = "Firebase not available";
        return;
      }

      const containerA = document.getElementById("topConnectors");
      const containerB = document.getElementById("mostPopular");

      containerA.innerHTML = "Loading...";
      containerB.innerHTML = "Loading...";

      try {
        const { scans, userMap } = await fetchFirestoreData();

        const outgoing = {}; // from → count
        const incoming = {}; // to → count

        scans.forEach(data => {
        const scannerPersonId = userMap[data.scannerUid] || data.scannerUid;
      
        outgoing[scannerPersonId] = (outgoing[scannerPersonId] || 0) + 1;
        incoming[data.scannedPersonId] = (incoming[data.scannedPersonId] || 0) + 1;
      });

        const sortedOutgoing = Object.entries(outgoing)
          .sort((a,b)=>b[1]-a[1])
          .slice(0,10);

        const sortedIncoming = Object.entries(incoming)
          .sort((a,b)=>b[1]-a[1])
          .slice(0,10);

        renderLeaderboard(containerA, sortedOutgoing);
        renderLeaderboard(containerB, sortedIncoming);

      } catch(e){
        console.error(e);
        containerA.innerHTML = "Error loading";
        containerB.innerHTML = "Error loading";
      }
    }

    async function fetchFirestoreData(){
      const { getDocs, collection, doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    
      const scansSnapshot = await getDocs(collection(window.db, "scans"));
      const scans = scansSnapshot.docs.map(doc => doc.data());
    
      // get all user → person mappings
      const usersSnapshot = await getDocs(collection(window.db, "users"));
      const userMap = {};
    
      usersSnapshot.forEach(doc => {
        const data = doc.data();
        userMap[doc.id] = data.personId; // uid → personId
      });
    
      return { scans, userMap };
    }


    function renderLeaderboard(container, data){
      container.innerHTML = "";

      data.forEach(([uid, count], i) => {
        const p = PEOPLE[uid] || {};

        const row = document.createElement("div");
        row.className = "historyItem";

        const img = document.createElement("img");
        img.className = "avatar";
        setImageSource(img, uid);

        const text = document.createElement("div");
        text.innerHTML = `
          <strong>${i+1}. ${p.name || uid}</strong><br>
          <small>${count} scans</small>
        `;

        row.appendChild(img);
        row.appendChild(text);
        container.appendChild(row);
      });
    }
  </script>

</body>
</html>
