<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <base href="/gsTeamSocial2026/">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --bg:#0B0F1A;
      --card:#121826;
      --muted:#98A2B3;
      --line:#27324A;
      --neon:#6CFF00;
      --text:#FFFFFF;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 18px 18px 110px; /* more space for bigger nav */
      text-align: center;
    }

    h1 { color: var(--neon); }

    .screen { display:none; }
    .screen.active { display:block; }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      margin: 16px auto;
      max-width: 420px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border-radius: 14px;
      border: none;
      font-weight: 900;
      font-size: 16px;
    }

    .primary { background: var(--neon); color: black; }
    .secondary { background: #1E2A44; color: white; }
    .ghost { background: none; border: 1px solid #444; color: white; }

    .historyItem {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #2A334C;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
    }

    /* ✅ NAV BAR UPGRADE */
    #nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px; /* 🔥 bigger */
      background: #121826;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2A334C;
    }

    #nav button {
      background: none;
      border: none;
      color: #aaa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }

    #nav button.active {
      color: var(--neon);
    }

    #nav img {
      width: 28px;
      height: 28px;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    #nav button.active img {
      opacity: 1;
      filter: drop-shadow(0 0 6px rgba(108,255,0,0.6));
    }

    /* 🔥 Scanner overlay remains same */
    #scanOverlay {
      position: fixed;
      inset: 0;
      background: #0B0F1A;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 9999;
    }

    #reader { width: 90%; max-width: 420px; }

    #scanFrame {
      position: absolute;
      width: 260px;
      height: 260px;
      border: 4px solid var(--neon);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

  </style>
</head>

<body>

<h1>🧱 Build Together</h1>

<!-- SCAN -->
<div id="scanScreen" class="screen active">
  <div class="card">
    <div id="status">Not signed in</div>

    <button class="btn primary" onclick="startScanner('signin')">
      Scan your badge
    </button>

    <button class="btn secondary" onclick="startScanner('scan')">
      Scan teammate
    </button>

    <button class="btn ghost" onclick="resetUser()">Reset</button>
  </div>
</div>

<!-- HISTORY -->
<div id="historyScreen" class="screen">
  <div class="card">
    <h3>Your Connections</h3>
    <div id="historyList"></div>
  </div>
</div>

<!-- SCANNER -->
<div id="scanOverlay">
  <div id="reader"></div>
  <div id="scanFrame"></div>
</div>

<!-- ✅ NEW NAV (ICON BASED) -->
<div id="nav">
  <button id="navScan" class="active" onclick="showScreen('scan')">
    <img src="Scan.svg">
    <span>Scan</span>
  </button>

  <button id="navHistory" onclick="showScreen('history')">
    <img src="History.svg">
    <span>History</span>
  </button>
</div>

<script>
const LS_USER = "user";
const LS_SCANS = "scans";

let scanner;
let isScanning = false;
let PEOPLE = {};

// ✅ Load people.json
async function loadPeople() {
  const res = await fetch("people.json");
  const data = await res.json();

  data.slice(1).forEach(p => {
    PEOPLE[p.D] = { name: p.A, title: p.C };
  });
}
loadPeople();

// ✅ Navigation
function showScreen(screen) {
  document.getElementById("scanScreen").classList.remove("active");
  document.getElementById("historyScreen").classList.remove("active");

  document.getElementById(screen + "Screen").classList.add("active");

  document.getElementById("navScan").classList.toggle("active", screen === "scan");
  document.getElementById("navHistory").classList.toggle("active", screen === "history");

  if (screen === "history") loadHistory();
}

// ✅ Scanner
async function startScanner(mode) {
  if (isScanning) return;
  isScanning = true;

  document.getElementById("scanOverlay").style.display = "flex";

  scanner = new Html5Qrcode("reader");

  await scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      handleScan(decodedText, mode);
      closeScanner();
    }
  );
}

function closeScanner() {
  scanner.stop().then(() => scanner.clear());
  document.getElementById("scanOverlay").style.display = "none";
  isScanning = false;
}

// ✅ Image loader (multi-format)
function setImageSource(img, uid) {
  const formats = ["jpg","jpeg","png","JPG"];
  let i = 0;

  function next() {
    if (i >= formats.length) return;
    img.src = `images/${uid}.${formats[i++]}`;
  }

  img.onerror = next;
  next();
}

// ✅ Scan logic
function handleScan(text, mode) {
  const id = text;

  if (mode === "signin") {
    localStorage.setItem(LS_USER, id);
    return;
  }

  const user = localStorage.getItem(LS_USER);
  if (!user || user === id) return;

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  if (!scans.find(s => s.from === user && s.to === id)) {
    scans.push({ from: user, to: id });
  }

  localStorage.setItem(LS_SCANS, JSON.stringify(scans));
}

// ✅ History
function loadHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  const user = localStorage.getItem(LS_USER);
  const scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  scans.filter(s => s.from === user).forEach(s => {
    const row = document.createElement("div");
    row.className = "historyItem";

    const img = document.createElement("img");
    img.className = "avatar";
    setImageSource(img, s.to);

    const person = PEOPLE[s.to] || {};

    row.innerHTML = `
      <div>
        <strong>${person.name || s.to}</strong><br>
        <small>${person.title || ""}</small>
      </div>
    `;

    row.prepend(img);
    list.appendChild(row);
  });
}

function resetUser() {
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
