<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/gsTeamSocial2026/">

  <!-- ✅ FIXED SCRIPT -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <style>
    body {
      font-family: Arial;
      background: #0B0F1A;
      color: white;
      margin: 0;
      padding: 20px 20px 110px;
    }

    h1 { color: #6CFF00; }

    .screen { display:none; }
    .active { display:block; }

    .card {
      background:#121826;
      padding:20px;
      border-radius:20px;
      margin:20px auto;
      max-width:420px;
    }

    .btn {
      width:100%;
      padding:16px;
      margin:10px 0;
      border-radius:14px;
      border:none;
      font-weight:bold;
    }

    .primary { background:#6CFF00; color:black; }
    .secondary { background:#1E2A44; color:white; }
    .ghost { background:none; border:1px solid #444; color:white; }

    .historyItem {
      display:flex;
      gap:10px;
      padding:10px;
      border-bottom:1px solid #2A334C;
    }

    .avatar {
      width:44px;
      height:44px;
      border-radius:8px;
    }

    #nav {
      position:fixed;
      bottom:0;
      width:100%;
      height:85px;
      background:#121826;
      display:flex;
    }

    #nav button {
      flex:1;
      border:none;
      background:none;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* ✅ SCANNER FIX */
    #scanOverlay {
      position:fixed;
      inset:0;
      background:#0B0F1A;
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    /* ✅ allow proper camera aspect (fix "short box") */
    #readerWrapper {
      position:relative;
      width:90vw;
      max-width:420px;
      aspect-ratio: 3 / 4; /* ✅ THIS fixes vertical squash */
    }

    #reader {
      width:100%;
      height:100%;
    }

    #reader video {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* ✅ Frame now proportional */
    #scanFrame {
      position:absolute;
      top:50%;
      left:50%;
      width:70%;
      height:50%; /* ✅ rectangular matches real scanner */
      border:4px solid #6CFF00;
      transform:translate(-50%,-50%);
      box-shadow:0 0 20px rgba(108,255,0,0.6);
      pointer-events:none;
    }

    #toast {
      position:fixed;
      bottom:110px;
      left:50%;
      transform:translateX(-50%);
      background:#121826;
      padding:12px 18px;
      border-radius:12px;
      border:1px solid #2A334C;
      display:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h1>Build Together</h1>

<div id="toast"></div>

<div id="scanScreen" class="screen active">
  <div class="card">
    <div id="status">Not signed in</div>

    <button class="btn primary" onclick="startScanner('signin')">Scan badge</button>
    <button class="btn secondary" onclick="startScanner('scan')">Scan teammate</button>
    <button class="btn ghost" onclick="resetUser()">Reset</button>
  </div>
</div>

<div id="historyScreen" class="screen">
  <div class="card">
    <h3>Connections</h3>
    <div id="historyList"></div>
  </div>
</div>

<div id="scanOverlay">
  <div id="readerWrapper">
    <div id="reader"></div>
    <div id="scanFrame"></div>
  </div>
</div>

<div id="nav">
  <button id="navScan" class="active" onclick="showScreen('scan')">Scan</button>
  <button id="navHistory" onclick="showScreen('history')">History</button>
</div>

<script>
const LS_USER = "user";
const LS_SCANS = "scans";

let PEOPLE = {};
let scanner;
let isScanning = false;

// ✅ LOAD PEOPLE
async function loadPeople() {
  const res = await fetch("people.json");
  const data = await res.json();

  data.slice(1).forEach(p=>{
    PEOPLE[p.D] = { name:p.A, title:p.C };
  });
}
loadPeople();

function showScreen(s){
  scanScreen.classList.toggle("active",s==="scan");
  historyScreen.classList.toggle("active",s==="history");

  navScan.classList.toggle("active",s==="scan");
  navHistory.classList.toggle("active",s==="history");

  if(s==="history") loadHistory();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=>{ t.style.display="none"; },2000);
}

// ✅ FIXED camera start + permissions
async function startScanner(mode){
  if(isScanning) return;
  isScanning = true;

  document.getElementById("scanOverlay").style.display="flex";

  try {
    // ✅ force permission prompt
    await navigator.mediaDevices.getUserMedia({ video:true });
  } catch(e) {
    alert("Camera permission is required");
    isScanning=false;
    return;
  }

  if(scanner){
    await scanner.stop().catch(()=>{});
    scanner.clear();
  }

  scanner = new Html5Qrcode("reader");

  await scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      aspectRatio: 1.333, // ✅ stabilizes sizing
      disableFlip: true,
      qrbox: (vw, vh) => {
        const min = Math.min(vw, vh);
        return {
          width: min * 0.7,
          height: min * 0.5
        };
      }
    },
    text=>{
      handleScan(text,mode);
      closeScanner();
    }
  );
}

async function closeScanner(){
  if(scanner){
    await scanner.stop().catch(()=>{});
    scanner.clear();
  }
  document.getElementById("scanOverlay").style.display="none";
  isScanning=false;
}

function handleScan(text,mode){
  let id=text;
  const person = PEOPLE[id];

  if(mode==="signin"){
    localStorage.setItem(LS_USER,id);
    showToast(person ? `👋 Welcome, ${person.name}` : `👋 Welcome`);
    return;
  }

  const user = localStorage.getItem(LS_USER);
  if(!user || user===id) return;

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  if(!scans.find(s=>s.from===user && s.to===id)){
    scans.push({from:user,to:id});
  }

  localStorage.setItem(LS_SCANS,JSON.stringify(scans));

  showToast(person ? `✅ +1 Connection: ${person.name}` : `✅ +1 Connection`);
}

function loadHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML="";

  const user = localStorage.getItem(LS_USER);
  const scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  scans.filter(s=>s.from===user).forEach(s=>{
    const row=document.createElement("div");
    row.className="historyItem";

    const p = PEOPLE[s.to] || {};

    row.innerHTML = `
      <div>
        <strong>${p.name || s.to}</strong><br>
        <small>${p.title || ""}</small>
      </div>
    `;
    list.appendChild(row);
  });
}

function resetUser(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
