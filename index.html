<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/gsTeamSocial2026/">

  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrGat6lUuENewTehvJ6yk1_hY2xROEIRw",
      authDomain: "buildtogethergs2026.firebaseapp.com",
      projectId: "buildtogethergs2026",
      storageBucket: "buildtogethergs2026.firebasestorage.app",
      messagingSenderId: "360094439415",
      appId: "1:360094439415:web:fef720adb4793b1d2b00f2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
  </script>

  <style>
    body {
      font-family: Arial;
      background: #0B0F1A;
      color: white;
      margin: 0;
      padding: 20px 20px 130px; /* space for bigger nav */
    }

    h1 { color: #6CFF00; }

    .screen { display:none; }
    .active { display:block; }

    .card {
      background:#121826;
      padding:24px;
      border-radius:24px;
      margin:24px auto;
      max-width:420px;
    }

    .btn {
      width:100%;
      padding:18px;
      margin:12px 0;
      border-radius:16px;
      border:none;
      font-weight:bold;
      font-size:16px;
    }

    /* ⭐ MAIN ACTION */
    .hero {
      background:#6CFF00;
      color:black;
      font-size:20px;
      padding:22px;
      border-radius:20px;
      box-shadow:0 0 18px rgba(108,255,0,0.6);
    }

    /* secondary actions */
    .secondary {
      background:#1E2A44;
      color:white;
    }

    .subtle {
      opacity:0.8;
    }

    .ghost {
      background:none;
      border:1px solid #444;
      color:white;
    }

    .historyItem {
      display:flex;
      gap:10px;
      padding:10px;
      border-bottom:1px solid #2A334C;
    }

    .avatar {
      width:44px;
      height:44px;
      border-radius:8px;
    }

    /* ✅ BIGGER THUMB NAV */
    #nav {
      position:fixed;
      bottom:0;
      width:100%;
      height:110px;
      background:#121826;
      display:flex;
      padding-bottom:10px;
    }

    #nav button {
      flex:1;
      border:none;
      background:none;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:16px;
      color:white;
    }

    .nav-primary {
      color:#6CFF00;
      font-weight:bold;
    }

    #scanOverlay {
      position:fixed;
      inset:0;
      background:#0B0F1A;
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    #readerWrapper {
      position:relative;
      width:90vw;
      max-width:420px;
      aspect-ratio: 3 / 4;
    }

    #reader {
      width:100%;
      height:100%;
    }

    #reader video {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    #scanFrame {
      position:absolute;
      top:50%;
      left:50%;
      width:70%;
      height:50%;
      border:4px solid #6CFF00;
      transform:translate(-50%,-50%);
      box-shadow:0 0 20px rgba(108,255,0,0.6);
      pointer-events:none;
    }

    #toast {
      position:fixed;
      bottom:130px;
      left:50%;
      transform:translateX(-50%);
      background:#121826;
      padding:12px 18px;
      border-radius:12px;
      border:1px solid #2A334C;
      display:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h1>Build Together</h1>

<div id="toast"></div>

<div id="scanScreen" class="screen active">
  <div class="card">
    <div id="status">Not signed in</div>

    <!-- ✅ PRIMARY ACTION -->
    <button class="btn hero" onclick="startScanner('scan')">
      Scan teammate
    </button>

    <!-- ✅ SECONDARY -->
    <button class="btn secondary subtle" onclick="startScanner('signin')">
      Scan your badge
    </button>

    <button class="btn ghost" onclick="resetUser()">Reset</button>
  </div>
</div>

<div id="historyScreen" class="screen">
  <div class="card">
    <h3>Connections</h3>
    <div id="historyList"></div>
  </div>
</div>

<div id="leaderboardScreen" class="screen">
  <div class="card">
    <h3>Leaderboard</h3>

    <h4>Top Connectors</h4>
    <div id="topConnectors"></div>

    <h4 style="margin-top:20px;">Most Popular</h4>
    <div id="mostPopular"></div>
  </div>
</div>

<div id="scanOverlay">
  <div id="readerWrapper">
    <div id="reader"></div>
    <div id="scanFrame"></div>
  </div>
</div>

<div id="nav">
  <button onclick="showScreen('scan')" class="nav-primary">Scan</button>
  <button onclick="showScreen('history')">History</button>
  <button onclick="showScreen('leaderboard')">🏆</button>
</div>

<!-- ✅ YOUR EXISTING SCRIPT UNCHANGED BELOW -->
<script>
/* leaving your logic exactly as-is */
</script>

</body>
</html>
