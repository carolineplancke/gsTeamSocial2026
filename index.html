<script>
const LS_USER = "user";
const LS_SCANS = "scans";

let PEOPLE = {};
let scanner;
let isScanning = false;

// ✅ LOAD PEOPLE
async function loadPeople() {
  const res = await fetch("people.json");
  const data = await res.json();

  data.forEach(p=>{
    PEOPLE[p.id] = { name:p.name, title:p.jobTitle };
  });
}

// ✅ RESTORE USER
function restoreUser(){
  const user = localStorage.getItem(LS_USER);
  if(!user) return;

  const person = PEOPLE[user];
  document.getElementById("status").innerText =
    `Signed in as ${person ? person.name : user}`;
}

// ✅ INIT
(async function init(){
  await loadPeople();
  restoreUser();
})();

// ✅ NAV
function showScreen(s){
  document.getElementById("scanScreen").classList.toggle("active", s==="scan");
  document.getElementById("historyScreen").classList.toggle("active", s==="history");
  document.getElementById("leaderboardScreen").classList.toggle("active", s==="leaderboard");

  if(s==="history") loadHistory();
  if(s==="leaderboard") loadLeaderboard();
}

// ✅ TOAST
function showToast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=>{ t.style.display="none"; },2000);
}

// ✅ SCANNER
async function startScanner(mode){
  if(isScanning) return;

  isScanning = true;
  document.getElementById("scanOverlay").style.display = "flex";

  if(scanner){
    try { await scanner.stop(); } catch {}
    scanner.clear();
  }

  scanner = new Html5Qrcode("reader");

  await scanner.start(
    { facingMode: "environment" },
    { fps: 10 },
    (text) => {
      if (!isScanning) return;
      isScanning = false;

      handleScan(text, mode);
      closeScanner();
    }
  );
}

async function closeScanner(){
  try {
    if(scanner){
      await scanner.stop();
      await scanner.clear();
    }
  } catch {}

  document.getElementById("scanOverlay").style.display = "none";
  isScanning = false;
}

// ✅ SCAN LOGIC
function handleScan(text, mode){
  const id = text.trim();
  const person = PEOPLE[id];

  if(mode === "signin"){
    localStorage.setItem(LS_USER, id);

    document.getElementById("status").innerText =
      `Signed in as ${person ? person.name : id}`;

    showToast(person ? `👋 Welcome, ${person.name}` : `👋 Signed in`);
    return;
  }

  const user = localStorage.getItem(LS_USER);
  if(!user){ showToast("Scan your badge first"); return; }
  if(user === id) return;

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  const exists = scans.some(s => s.from === user && s.to === id);

  if(!exists){
    scans.push({ from:user, to:id });
    localStorage.setItem(LS_SCANS, JSON.stringify(scans));

    if(window.db){
      addDoc(collection(window.db, "scans"), {
        from: user,
        to: id,
        timestamp: Date.now()
      }).catch(()=>{});
    }
  }

  showToast(person ? `✅ +1 ${person.name}` : `✅ Saved`);
}

// ✅ HISTORY
function loadHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  const user = localStorage.getItem(LS_USER);
  const scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  scans.filter(s => s.from === user).forEach(s => {
    const row = document.createElement("div");
    row.className = "historyItem";

    const img = document.createElement("img");
    img.className = "avatar";
    img.src = `images/${s.to}.jpg`;

    const p = PEOPLE[s.to] || {};

    const text = document.createElement("div");
    text.innerHTML = `
      <strong>${p.name || s.to}</strong><br>
      <small>${p.title || ""}</small>
    `;

    row.appendChild(img);
    row.appendChild(text);
    list.appendChild(row);
  });
}

// ✅ RESET
function resetUser(){
  localStorage.clear();
  location.reload();
}

// ✅ LEADERBOARD
async function loadLeaderboard(){
  const containerA = document.getElementById("topConnectors");
  const containerB = document.getElementById("mostPopular");

  containerA.innerHTML = "Loading...";
  containerB.innerHTML = "Loading...";

  try {
    const docs = await fetchFirestoreScans();

    const outgoing = {};
    const incoming = {};

    docs.forEach(doc => {
      const data = doc.data();
      outgoing[data.from] = (outgoing[data.from] || 0) + 1;
      incoming[data.to] = (incoming[data.to] || 0) + 1;
    });

    renderLeaderboard(containerA, Object.entries(outgoing).sort((a,b)=>b[1]-a[1]).slice(0,10));
    renderLeaderboard(containerB, Object.entries(incoming).sort((a,b)=>b[1]-a[1]).slice(0,10));

  } catch(e){
    console.error(e);
  }
}

async function fetchFirestoreScans(){
  const { getDocs, collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
  const snapshot = await getDocs(collection(window.db, "scans"));
  return snapshot.docs;
}

function renderLeaderboard(container, data){
  container.innerHTML = "";

  data.forEach(([uid, count], i) => {
    const p = PEOPLE[uid] || {};

    const row = document.createElement("div");
    row.className = "historyItem";

    const img = document.createElement("img");
    img.className = "avatar";
    img.src = `images/${uid}.jpg`;

    const text = document.createElement("div");
    text.innerHTML = `
      <strong>${i+1}. ${p.name || uid}</strong><br>
      <small>${count} scans</small>
    `;

    row.appendChild(img);
    row.appendChild(text);

    container.appendChild(row);
  });
}
</script>
