<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/gsTeamSocial2026/">

  <!-- ✅ FIXED SCRIPT -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <style>
    body {
      font-family: Arial;
      background: #0B0F1A;
      color: white;
      margin: 0;
      padding: 20px 20px 110px;
    }

    h1 { color: #6CFF00; }

    .screen { display:none; }
    .active { display:block; }

    .card {
      background:#121826;
      padding:20px;
      border-radius:20px;
      margin:20px auto;
      max-width:420px;
    }

    .btn {
      width:100%;
      padding:16px;
      margin:10px 0;
      border-radius:14px;
      border:none;
      font-weight:bold;
    }

    .primary { background:#6CFF00; color:black; }
    .secondary { background:#1E2A44; color:white; }
    .ghost { background:none; border:1px solid #444; color:white; }

    .historyItem {
      display:flex;
      gap:10px;
      padding:10px;
      border-bottom:1px solid #2A334C;
    }

    .avatar {
      width:44px;
      height:44px;
      border-radius:8px;
    }

    #nav {
      position:fixed;
      bottom:0;
      width:100%;
      height:85px;
      background:#121826;
      display:flex;
    }

    #nav button {
      flex:1;
      border:none;
      background:none;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* ✅ SCANNER FIX */
    #scanOverlay {
      position:fixed;
      inset:0;
      background:#0B0F1A;
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    /* ✅ allow proper camera aspect (fix "short box") */
    #readerWrapper {
      position:relative;
      width:90vw;
      max-width:420px;
      aspect-ratio: 3 / 4; /* ✅ THIS fixes vertical squash */
    }

    #reader {
      width:100%;
      height:100%;
    }

    #reader video {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* ✅ Frame now proportional */
    #scanFrame {
      position:absolute;
      top:50%;
      left:50%;
      width:70%;
      height:50%; /* ✅ rectangular matches real scanner */
      border:4px solid #6CFF00;
      transform:translate(-50%,-50%);
      box-shadow:0 0 20px rgba(108,255,0,0.6);
      pointer-events:none;
    }

    #toast {
      position:fixed;
      bottom:110px;
      left:50%;
      transform:translateX(-50%);
      background:#121826;
      padding:12px 18px;
      border-radius:12px;
      border:1px solid #2A334C;
      display:none;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h1>Build Together</h1>

<div id="toast"></div>

<div id="scanScreen" class="screen active">
  <div class="card">
    <div id="status">Not signed in</div>

    <button class="btn primary" onclick="startScanner('signin')">Scan badge</button>
    <button class="btn secondary" onclick="startScanner('scan')">Scan teammate</button>
    <button class="btn ghost" onclick="resetUser()">Reset</button>
  </div>
</div>

<div id="historyScreen" class="screen">
  <div class="card">
    <h3>Connections</h3>
    <div id="historyList"></div>
  </div>
</div>

<div id="scanOverlay">
  <div id="readerWrapper">
    <div id="reader"></div>
    <div id="scanFrame"></div>
  </div>
</div>

<div id="nav">
  <button id="navScan" class="active" onclick="showScreen('scan')">Scan</button>
  <button id="navHistory" onclick="showScreen('history')">History</button>
</div>

<script>
const LS_USER = "user";
const LS_SCANS = "scans";

let PEOPLE = {};
let scanner;
let isScanning = false;

// ✅ LOAD PEOPLE

(async function init(){
  restoreUser();  await loadPeople();
})();

loadPeople();

function setImageSource(img, uid){
  const formats = ["jpg","jpeg","png","JPG"];
  let index = 0;

  function tryNext(){
    if(index >= formats.length) return;

    img.src = `images/${uid}.${formats[index++]}`;
  }

  img.onerror = tryNext;

  tryNext();
}
  
function showScreen(s){
  scanScreen.classList.toggle("active",s==="scan");
  historyScreen.classList.toggle("active",s==="history");

  navScan.classList.toggle("active",s==="scan");
  navHistory.classList.toggle("active",s==="history");

  if(s==="history") loadHistory();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=>{ t.style.display="none"; },2000);
}

async function startScanner(mode){
  if(isScanning) return;

  isScanning = true;
  document.getElementById("scanOverlay").style.display = "flex";

  if(scanner){
    try { await scanner.stop(); } catch {}
    scanner.clear();
  }

  scanner = new Html5Qrcode("reader");

  await scanner.start(
    { facingMode: "environment" },
    { fps: 10 },
    (text) => {
      if (!isScanning) return;

      isScanning = false;

      console.log("SCANNED:", text, "| MODE:", mode);

      handleScan(text, mode);
      closeScanner();
    },
    () => {}
  );
}

async function closeScanner(){
  try {
    if(scanner){
      await scanner.stop();
      await scanner.clear();
    }
  } catch(e) {
    console.warn("Scanner stop issue:", e);
  }

  document.getElementById("scanOverlay").style.display = "none";
  isScanning = false;
}

function handleScan(text, mode){
  const id = text.trim();
  const person = PEOPLE[id];

  console.log("---- SCAN EVENT ----");
  console.log("Mode:", mode);
  console.log("ID:", id);

  if(mode === "signin"){
  localStorage.setItem(LS_USER, id);

  console.log("✅ USER SAVED:", id);

  // ✅ UPDATE UI IMMEDIATELY
  const name = person ? person.name : id;
  document.getElementById("status").innerText = `Signed in as ${name}`;

  showToast(
    person ? `👋 Welcome, ${person.name}` : `👋 Signed in`
  );

  return;
}

  function restoreUser(){
  const user = localStorage.getItem(LS_USER);

  if(!user) return;

  const person = PEOPLE[user];
  const name = person ? person.name : user;

  document.getElementById("status").innerText = `Signed in as ${name}`;

  console.log("✅ RESTORED USER:", user);
}
  
  const user = localStorage.getItem(LS_USER);

  console.log("Current user:", user);

  if(!user){
    console.warn("❌ No user signed in");
    showToast("Scan your badge first");
    return;
  }

  if(user === id){
    console.warn("❌ Self scan");
    return;
  }

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  const exists = scans.some(s => s.from === user && s.to === id);

  if(!exists){
    scans.push({ from: user, to: id });

    localStorage.setItem(LS_SCANS, JSON.stringify(scans));

    console.log("✅ SAVED:", scans);
  } else {
    console.log("⚠️ Already scanned");
  }

  showToast(
    person ? `✅ +1 ${person.name}` : `✅ Saved`
  );
}

function loadHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  const user = localStorage.getItem(LS_USER);
  const scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  scans
    .filter(s => s.from === user)
    .forEach(s => {

      const row = document.createElement("div");
      row.className = "historyItem";

      // ✅ CREATE IMAGE
      const img = document.createElement("img");
      img.className = "avatar";

      // ✅ LOAD IMAGE FROM UID
      setImageSource(img, s.to);

      const p = PEOPLE[s.to] || {};

      const text = document.createElement("div");
      text.innerHTML = `
        <strong>${p.name || s.to}</strong><br>
        <small>${p.title || ""}</small>
      `;

      row.appendChild(img);
      row.appendChild(text);

      list.appendChild(row);
    });
}

function resetUser(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
