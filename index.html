<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0B0F1A;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #6CFF00;
    }

    .screen {
      display: none;
    }

    .active {
      display: block;
    }

    .card {
      background: #121826;
      border-radius: 20px;
      padding: 20px;
      margin: 20px auto;
      max-width: 420px;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border-radius: 14px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #6CFF00;
      color: black;
    }

    .secondary {
      background: #1E2A44;
      color: white;
    }

    .ghost {
      background: none;
      border: 1px solid #444;
      color: white;
    }

    #status {
      margin-bottom: 10px;
      font-weight: bold;
    }

    /* NAV BAR */
    #nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #121826;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    #nav button {
      background: none;
      color: white;
      border: none;
      font-size: 14px;
    }

    /* SCANNER OVERLAY */
    #scanOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0B0F1A;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    #scanHeader {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
    }

    #scanFrame {
      position: absolute;
      width: 260px;
      height: 260px;
      border: 4px solid #6CFF00;
      border-radius: 20px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #scanHint {
      position: absolute;
      bottom: 80px;
      font-size: 14px;
      opacity: 0.7;
    }

    /* HISTORY LIST */
    .historyItem {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #2A334C;
    }
  </style>
</head>

<body>

<h1>🧱 Build Together 2026</h1>

<!-- ✅ SCAN SCREEN -->
<div id="scanScreen" class="screen active">
  <div class="card">
    <div id="status">Not signed in</div>

    <button class="btn primary" onclick="startScanner('signin')">
      Scan your badge to sign in
    </button>

    <button class="btn secondary" onclick="startScanner('scan')">
      Scan a teammate
    </button>

    <button class="btn ghost" onclick="resetUser()">Reset</button>
  </div>
</div>

<!-- ✅ HISTORY SCREEN -->
<div id="historyScreen" class="screen">
  <div class="card">
    <h3>Your Connections</h3>
    <div id="historyList"></div>
  </div>
</div>

<!-- ✅ LEADERBOARD SCREEN (basic for now) -->
<div id="leaderboardScreen" class="screen">
  <div class="card">
    <h3>Leaderboard</h3>
    <p id="yourScore"></p>
  </div>
</div>

<!-- ✅ SCANNER -->
<div id="scanOverlay">
  <div id="scanHeader">
    <span>Scan QR</span>
    <button onclick="closeScanner()">✕</button>
  </div>

  <div id="reader"></div>
  <div id="scanFrame"></div>
  <div id="scanHint">Align QR code inside the frame</div>
</div>

<!-- ✅ NAV BAR -->
<div id="nav">
  <button onclick="showScreen('scan')">📷 Scan</button>
  <button onclick="showScreen('history')">👥 History</button>
  <button onclick="showScreen('leaderboard')">🏆 Leaderboard</button>
</div>

<script>
const LS_USER = "qrgame_user";
const LS_SCANS = "qrgame_scans";

let scanner = null;
let isScanning = false;

// NAVIGATION
function showScreen(screen) {
  document.getElementById("scanScreen").classList.remove("active");
  document.getElementById("historyScreen").classList.remove("active");
  document.getElementById("leaderboardScreen").classList.remove("active");

  document.getElementById(screen + "Screen").classList.add("active");

  if (screen === "history") loadHistory();
  if (screen === "leaderboard") loadLeaderboard();
}

// RESET
function resetUser() {
  localStorage.clear();
  location.reload();
}

// SCANNER
async function startScanner(mode) {
  if (isScanning) return;
  isScanning = true;

  document.getElementById("scanOverlay").style.display = "flex";

  scanner = new Html5Qrcode("reader");

  await scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      handleScan(decodedText, mode);
      closeScanner();
    }
  );
}

function closeScanner() {
  if (scanner) {
    scanner.stop().then(() => scanner.clear());
  }

  document.getElementById("scanOverlay").style.display = "none";
  isScanning = false;
}

// SCAN LOGIC
function handleScan(text, mode) {
  const id = text;

  if (mode === "signin") {
    localStorage.setItem(LS_USER, id);
    return;
  }

  const user = localStorage.getItem(LS_USER);
  if (!user || user === id) return;

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  if (!scans.find(s => s.from === user && s.to === id)) {
    scans.push({ from: user, to: id });
  }

  localStorage.setItem(LS_SCANS, JSON.stringify(scans));
}

// ✅ HISTORY
function loadHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  const scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  scans.forEach(s => {
    const div = document.createElement("div");
    div.className = "historyItem";
    div.innerText = `✅ ${s.to}`;
    list.appendChild(div);
  });
}

// ✅ LEADERBOARD
function loadLeaderboard() {
  const scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];
  document.getElementById("yourScore").innerText =
    "You have " + scans.length + " connections";
}
</script>

</body>
</html>
