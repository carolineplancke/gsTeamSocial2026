<!DOCTYPE html>
<html>
<head>
  <title>Build Together 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- QR Scanner library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #F5F5F5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #0055BF;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin: 20px auto;
      max-width: 420px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #E3000B;
      color: white;
    }

    .secondary {
      background: #0055BF;
      color: white;
    }

    .ghost {
      background: transparent;
      border: 1px solid #ccc;
    }

    #status {
      margin: 10px;
      font-weight: bold;
    }

    #scanner {
      width: 100%;
      max-width: 420px;
      margin: 20px auto;
      padding: 10px;
    }

    #scanner video {
      border-radius: 16px;
    }

    .success { color: green; }
    .warning { color: #E3000B; }

    /* Hide junk */
    input[type="file"] { display: none !important; }

  </style>
</head>

<body>

<h1>Build Together 2026</h1></h1>

<div class="card">
  <div id="status">Not signed in</div>

  <!-- ✅ FIXED BUTTONS -->
  <button class="btn primary" onclick="prepareScanner('signin')">
    Scan your badge to sign in
  </button>

  <button class="btn secondary" onclick="prepareScanner('scan')">
    Scan a teammate
  </button>

  <button class="btn ghost" onclick="resetUser()">
    Reset
  </button>
</div>

<div id="scanner"></div>

<script>
const LS_USER = "qrgame_user";
const LS_SCANS = "qrgame_scans";

let scanner = null;
let isScanning = false;

const statusEl = document.getElementById("status");

// ✅ Update status display
function updateStatus() {
  const user = localStorage.getItem(LS_USER);

  if (user) {
    statusEl.innerText = "✅ You are: " + user;
    statusEl.className = "success";
  } else {
    statusEl.innerText = "Not signed in";
    statusEl.className = "";
  }
}

updateStatus();

// ✅ Reset everything
function resetUser() {
  localStorage.clear();
  location.reload();
}

// ✅ Step 1: clean "Enable camera" UX
function prepareScanner(mode) {
  isScanning = false;

  statusEl.innerText = "📷 Tap below to enable camera";

  const scannerDiv = document.getElementById("scanner");

  scannerDiv.innerHTML = `
    <div class="card">
      <p>Ready to scan</p>
      <button class="btn primary" onclick="startScanner('${mode}')">
        Enable camera
      </button>
    </div>
  `;
}

// ✅ Step 2: launch scanner
function startScanner(mode) {
  if (isScanning) return;
  isScanning = true;

  const scannerDiv = document.getElementById("scanner");
  scannerDiv.innerHTML = "";

  scanner = new Html5QrcodeScanner("scanner", {
    fps: 10,
    qrbox: { width: 280, height: 280 }
  });

  scanner.render((decodedText) => {
    handleScan(decodedText, mode);

    scanner.clear().then(() => {
      isScanning = false;
    });
  });
}

// ✅ Handle scan logic
function handleScan(text, mode) {
  let id = text;

  try {
    if (text.startsWith("http")) {
      const url = new URL(text);
      id = url.searchParams.get("id") || text;
    }
  } catch {}

  if (!id) return;

  // SIGN IN
  if (mode === "signin") {
    localStorage.setItem(LS_USER, id);
    updateStatus();
    flashStatus("✅ Signed in as " + id, "success");
    return;
  }

  const currentUser = localStorage.getItem(LS_USER);

  if (!currentUser) {
    flashStatus("⚠️ Sign in first", "warning");
    return;
  }

  if (currentUser === id) {
    flashStatus("😄 That’s you!", "warning");
    return;
  }

  let scans = JSON.parse(localStorage.getItem(LS_SCANS)) || [];

  const exists = scans.find(s => s.from === currentUser && s.to === id);

  if (exists) {
    flashStatus("⚠️ Already scanned", "warning");
    return;
  }

  scans.push({
    from: currentUser,
    to: id,
    time: new Date().toISOString()
  });

  localStorage.setItem(LS_SCANS, JSON.stringify(scans));

  flashStatus("✅ +1 connection with " + id, "success");
}

// ✅ Feedback
function flashStatus(text, type) {
  statusEl.innerText = text;
  statusEl.className = type;

  setTimeout(() => updateStatus(), 2000);
}
</script>

</body>
</html>
